name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Copy web files into www
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js css js icons www/
      - name: Add Android project
        run: npx cap add android
      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2a0a1a' --iconBackgroundColorDark '#2a0a1a'
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
