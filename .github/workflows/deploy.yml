name: Build Cherry Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js for dependency handling
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Set up Java JDK required for Android compilation
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install project dependencies
      - name: Install Dependencies
        run: |
          npm install
          npm run build --if-present

      # 6. Generate Native Android Platform safely via config file
      - name: Generate Native Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Create capacitor configuration file automatically
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.cherry.app",
            "appName": "Cherry",
            "webDir": "."
          }
          EOF

          npx cap add android

      # 7. Compile the Android Debug APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # 8. Save the compiled APK file
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-App-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
