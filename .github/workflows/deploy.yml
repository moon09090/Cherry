name: Build Cherry Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Ensure a valid package.json and web entry point exist
      - name: Prepare Project Files
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "cherry-app", "version": "1.0.0", "private": true}' > package.json
          fi
          if [ ! -f index.html ]; then
            echo '<(!DOCTYPE html><html><head><title>Cherry</title></head><body><h1>Cherry App</h1></body></html>' > index.html
          fi
          npm install --package-lock-only || true

      # 6. Install Dependencies and Capacitor
      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Create clean Capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.cherry.app",
            "appName": "Cherry",
            "webDir": "."
          }
          EOF

          # Add Android native platform safely
          npx cap add android

      # 7. Compile the Android Debug APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # 8. Save and Upload the APK Artifact
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-App-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            
