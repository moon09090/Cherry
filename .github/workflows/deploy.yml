name: Build Cherry Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch your code from GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java environment needed for native builds
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configure Android SDK tools and automatically accept licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-license: true

      # 4. Make Gradle build tool executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
        continue-on-error: true

      # 5. Build Debug APK package
      - name: Build Android APK
        run: ./gradlew assembleDebug
        continue-on-error: true

      # 6. Save the compiled APK file to GitHub
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-App-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
