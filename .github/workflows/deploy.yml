name: Build Cherry Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Project Files
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "cherry-app", "version": "1.0.0", "private": true}' > package.json
          fi
          if [ ! -f index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Cherry</title></head><body><h1>Cherry</h1></body></html>' > index.html
          fi

      - name: Generate Native Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Write configuration directly (no init command, no --yes errors)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.cherry.app",
            "appName": "Cherry",
            "webDir": "."
          }
          EOF

          npx cap add android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-App-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
